    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">

<body class="theme-1">
    <div id="wrapper">
        <div id="header" data-src="header.html"></div>
        <div id="mainPageContent">

            <section class="section-wrapper contact-27">
                <div class="container">

                    <!-- Header -->
                    <div class="contact-27-header text-center anim-bounce-in" style="opacity: 1 !important;">
                        <div class="contact-27-icon">
                            <i class="bi bi-chat-dots"></i>
                        </div>
                        <h2>Get In Touch</h2>
                        <p>Plan your dream Indian wedding with elegance, tradition &amp; perfection.</p>

                        <div class="contact-27-info">
                            <span><i class="bi bi-telephone"></i> +91 98765 43210</span>
                            <span><i class="bi bi-envelope"></i> weddings@royalevents.in</span>
                            <span><i class="bi bi-geo-alt"></i> Mumbai · Delhi · Jaipur</span>
                        </div>
                    </div>

                    <!-- Form -->
                    <div class="row">
                        <div class="col-md-6 col-md-offset-3 anim-bounce-in" style="opacity: 1 !important;">
                            <div class="contact-27-form-box">
                                <form>
                                    <div class="row">
                                        <div class="col-xs-6">
                                            <input type="text" class="form-control contact-27-input"
                                                placeholder="First Name">
                                        </div>
                                        <div class="col-xs-6">
                                            <input type="text" class="form-control contact-27-input"
                                                placeholder="Last Name">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-xs-6">
                                            <input type="email" class="form-control contact-27-input"
                                                placeholder="Email">
                                        </div>
                                        <div class="col-xs-6">
                                            <input type="text" class="form-control contact-27-input"
                                                placeholder="Phone">
                                        </div>
                                    </div>

                                    <textarea class="form-control contact-27-textarea" rows="3"
                                        placeholder="Tell us about your wedding..."></textarea>

                                    <button type="submit" class="contact-27-btn">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </div>
        <div id="footer" data-src="footer.html"></div>

    </div>
    <script src="assets/js/middle-section.js"></script>
    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/init.js"></script>
    <script src="assets/js/plugins.js"></script>
    <script src="assets/js/jquery.main.js"></script>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/Observer.min.js"></script>
    <script src="assets/js/gsap.effects.js"></script>
    <!-- for editing purpose -->
    <script src="assets/js/common_js/send_email.js"></script>
    <script src="assets/js/common_js/html_image_editor.js"></script>
    <script src="assets/js/common_js/windows_postmessage.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script>
        var fileName = document.title || "index";

        $(document).ready(function () {
            loadHeaderFooter("header", "client-assets/nvee10091/nvee10091/header.html");
            loadHeaderFooter("footer", "client-assets/nvee10091/nvee10091/footer.html");

            loadHeaderFooter("header", "header.html");
            loadHeaderFooter("footer", "footer.html");
        });

        function loadHeaderFooter(id, file) {
            $("#" + id).load(file, function (response, status, xhr) {
                if (status === "error") {
                    console.error("Error loading " + file + ":", xhr.status, xhr.statusText);
                    return;
                }

                $("#" + id).find("a").addClass("edit-site");

                if (id === "header") {
                    if (fileName.toLowerCase() === "index" || fileName.toLowerCase() === "home") {
                        $("#" + id).find(".main-header-section").css("display", "inline-block");
                    } else {
                        $("#" + id).find(".main-header-section").css("display", "none");
                        $("#" + id).find(".header-breadcrumb-section").css("display", "inline-block");
                        $("#" + id).find(".header-breadcrumb-section .Page_name")
                            .text(fileName.charAt(0).toUpperCase() + fileName.slice(1));
                    }
                }
            });
        }
    </script>

</body>

</html>
